<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0B0E">
<title>Stage View · Sunday 6 September 2026</title>
<meta name="description" content="Live NOW/NEXT running order for Sunday 6 September 2026 — for whoever is running the service, readable from across the room.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#0B0B0E;
    --red:#D0441C;
    --red-hi:#F0603A;
    --bone:#F4EFE6;
    --bone-dim:rgba(244,239,230,0.44);
    --bone-faint:rgba(244,239,230,0.18);
    --display:'Anton',system-ui,sans-serif;
    --ui:'Inter Tight',-apple-system,BlinkMacSystemFont,sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;background:var(--obsidian);overflow:hidden;}
  body{font-family:var(--ui);color:var(--bone);}

  .frame{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    padding:28px 36px calc(24px + var(--safe-b));
  }

  /* TOP BAR */
  .topbar{display:flex; align-items:baseline; justify-content:space-between; flex-shrink:0;}
  .eyebrow{font-size:13px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--bone-dim);}
  .step-counter{font-size:13px; font-weight:700; letter-spacing:1.5px; color:var(--bone-dim); font-variant-numeric:tabular-nums;}

  /* MAIN — NOW / NEXT */
  .main{flex:1; display:flex; flex-direction:column; justify-content:center; gap:clamp(18px,3vh,36px); min-height:0;}

  .now-label, .next-label{
    font-size:clamp(13px,1.6vw,16px); font-weight:800; letter-spacing:3px; text-transform:uppercase;
  }
  .now-label{color:var(--red-hi);}
  .next-label{color:var(--bone-faint);}

  .now-title{
    font-family:var(--display); text-transform:uppercase;
    font-size:clamp(2.4rem, 7.5vw, 5.2rem);
    line-height:1.02; color:var(--bone);
    margin-top:6px;
  }
  .now-who{
    font-size:clamp(1.1rem, 2.6vw, 1.9rem); font-weight:700; color:var(--bone);
    margin-top:14px;
  }
  .now-who.open{color:var(--red-hi);}

  .next-block{opacity:0.62;}
  .next-title{
    font-family:var(--display); text-transform:uppercase;
    font-size:clamp(1.3rem, 3.4vw, 2.1rem);
    line-height:1.05; color:var(--bone-dim);
    margin-top:4px;
  }
  .next-who{font-size:clamp(0.85rem,1.6vw,1.05rem); font-weight:600; color:var(--bone-faint); margin-top:6px;}

  /* CRITICAL CUE */
  .cue{
    flex-shrink:0;
    display:none;
    align-items:center; gap:14px;
    background:var(--red); color:var(--bone);
    border-radius:16px;
    padding:16px 20px;
    font-size:clamp(0.95rem,1.9vw,1.25rem);
    font-weight:700; line-height:1.35;
    margin-top:clamp(14px,2.5vh,28px);
  }
  .cue.is-on{display:flex;}
  .cue-icon{font-size:1.4em; flex-shrink:0;}

  /* PROGRESS DOTS */
  .progress{display:flex; gap:6px; justify-content:center; flex-shrink:0; margin-top:18px; flex-wrap:wrap;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--bone-faint);}
  .dot.is-done{background:var(--bone-dim);}
  .dot.is-current{background:var(--red-hi); width:20px; border-radius:4px;}

  /* TAP ZONES */
  .tap{position:fixed; top:0; bottom:0; width:34%; z-index:5;}
  .tap-prev{left:0;} .tap-next{right:0;}

  /* HINT (first load only) */
  .hint{
    position:fixed; left:50%; bottom:calc(48px + var(--safe-b)); transform:translateX(-50%);
    font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--bone-faint);
    background:var(--obsidian);
    padding:4px 14px; border-radius:100px;
    opacity:1; transition:opacity 0.6s;
    pointer-events:none;
  }
  .hint.is-hidden{opacity:0;}

  @media (max-width:520px){
    .frame{padding:20px 20px calc(18px + var(--safe-b));}
  }
</style>
</head>
<body>

<div class="tap tap-prev" id="tap-prev" aria-label="Previous step"></div>
<div class="tap tap-next" id="tap-next" aria-label="Next step"></div>

<div class="frame">
  <div class="topbar">
    <div class="eyebrow">Calvary Hephzibah · Sunday 6 Sep 2026</div>
    <div class="step-counter" id="step-counter">1 / 17</div>
  </div>

  <div class="main">
    <div>
      <div class="now-label">Now</div>
      <div class="now-title" id="now-title">—</div>
      <div class="now-who" id="now-who">—</div>
    </div>

    <div class="next-block">
      <div class="next-label">Next</div>
      <div class="next-title" id="next-title">—</div>
      <div class="next-who" id="next-who">—</div>
    </div>

    <div class="cue" id="cue">
      <span class="cue-icon">⚠</span>
      <span id="cue-text"></span>
    </div>
  </div>

  <div class="progress" id="progress"></div>
</div>

<div class="hint" id="hint">Tap left / right to move</div>

<script>
(function(){
  var STEPS = [
    {now:"Welcome & Bible Reading", who:"Pastor Kayode Ogungbenro", next:"Opening Prayer"},
    {now:"Opening Prayer", who:"Brother Ernest Omoregie", next:"Worship — Give Thanks to the Lord"},
    {now:"Praise — Give Thanks to the Lord", who:"Worship Team", next:"Praise — Let It Rise", cue:"Keys TBC — confirmed at soundcheck"},
    {now:"Praise — Let It Rise", who:"Worship Team", next:"Praise — You Reign"},
    {now:"Praise — You Reign", who:"Worship Team", next:"Worship — I Will Worship", cue:"Two extended vamps — no lyric on screen, hold and follow the worship leader"},
    {now:"Worship — I Will Worship", who:"Worship Team", next:"Worship — Heart of Worship"},
    {now:"Worship — Heart of Worship", who:"Worship Team", next:"Worship — Jesus at the Centre"},
    {now:"Worship — Jesus at the Centre", who:"Worship Team", next:"Communion"},
    {now:"Communion", who:"Pastor Gbenga Adebanjo", next:"Media Awareness"},
    {now:"Media Awareness", who:"Pastor Gbenga Adebanjo", next:"Announcements"},
    {now:"Announcements", who:"Pastor Kayode Ogungbenro", next:"Bible Reading"},
    {now:"Bible Reading", who:"OPEN — no reader named", open:true, next:"Sermon", cue:"Matthew 6:9–11 · Matthew 6:33 · John 10:10 (KJV) — confirm reader live"},
    {now:"Sermon — Being Formed By The Kingdom", who:"Pastor Shade Olatoye", next:"Offering"},
    {now:"Offering — Give Thanks to the Lord", who:"OPEN — no leader named", open:true, next:"Closing Prayer", cue:"Confirm offering leader live"},
    {now:"Closing Prayer", who:"Sister Petty", next:"Benediction"},
    {now:"Benediction", who:"Sister Folake Okunubi", next:"End of Service"},
    {now:"End of Service — Thank You Lord", who:"Worship Team", next:"Service closes"}
  ];

  var total = STEPS.length;
  var idx = 0;
  var KEY = "stage-view-06sep2026-idx";

  var elNowTitle = document.getElementById('now-title');
  var elNowWho = document.getElementById('now-who');
  var elNextTitle = document.getElementById('next-title');
  var elNextWho = document.getElementById('next-who');
  var elCue = document.getElementById('cue');
  var elCueText = document.getElementById('cue-text');
  var elCounter = document.getElementById('step-counter');
  var elProgress = document.getElementById('progress');
  var hint = document.getElementById('hint');

  STEPS.forEach(function(_, i){
    var d = document.createElement('div');
    d.className = 'dot';
    elProgress.appendChild(d);
  });
  var dots = elProgress.querySelectorAll('.dot');

  function store(v){ try{ localStorage.setItem(KEY, v); }catch(e){} }
  function read(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }

  function render(){
    var s = STEPS[idx];
    var n = STEPS[idx+1];
    elNowTitle.textContent = s.now;
    elNowWho.textContent = s.who;
    elNowWho.classList.toggle('open', !!s.open);

    if (n) {
      elNextTitle.textContent = n.now;
      elNextWho.textContent = n.who;
    } else {
      elNextTitle.textContent = "Service closes";
      elNextWho.textContent = "";
    }

    if (s.cue) {
      elCue.classList.add('is-on');
      elCueText.textContent = s.cue;
    } else {
      elCue.classList.remove('is-on');
    }

    elCounter.textContent = (idx+1) + ' / ' + total;
    dots.forEach(function(d, i){
      d.classList.toggle('is-done', i < idx);
      d.classList.toggle('is-current', i === idx);
    });
    store(idx);
  }

  function go(delta){
    var next = idx + delta;
    if (next < 0 || next > total - 1) return;
    idx = next;
    render();
    hideHint();
  }

  function hideHint(){
    hint.classList.add('is-hidden');
  }

  document.getElementById('tap-prev').addEventListener('click', function(){ go(-1); });
  document.getElementById('tap-next').addEventListener('click', function(){ go(1); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  });
  setTimeout(hideHint, 4500);

  var saved = read();
  if (saved !== null) {
    var n = parseInt(saved, 10);
    if (!isNaN(n) && n >= 0 && n < total) idx = n;
  }
  render();

  /* Keep the screen on for the duration of the service */
  var lock = null;
  function wake(){
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(l){ lock = l; }).catch(function(){});
  }
  wake();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && lock === null) wake();
  });
})();
</script>

</body>
</html>
