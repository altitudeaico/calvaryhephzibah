<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team | Calvary Hephzibah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="nav.css">
<script src="vendor/supabase.js"></script>
</head>
<body>

<div class="wrap hidden" id="content">
  <h2 style="margin-top:8px;">Team</h2>
  <p class="lede" id="role-sub"></p>

  <div class="row-list" id="tool-rows"></div>

  <p style="font-size:13px; color:var(--ink-tertiary); margin-top:8px;">
    These currently open in their own separate tools, on their own separate sign-in for now. Bringing them fully into this one account is the next phase of this project.
  </p>

  <footer>Calvary Hephzibah Full Gospel Church &middot; <a href="mailto:hello@altitudeai.co">Questions? Ask here</a></footer>
</div>

<script src="icons.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script>
(async function () {
  const result = await CalvaryAuth.requireAuth(["staff", "admin", "volunteer", "media"]);
  if (!result) return;
  const { profile } = result;
  document.getElementById("content").classList.remove("hidden");
  CalvaryNav.render("team", profile);
  document.getElementById("role-sub").textContent = "Signed in as " + (profile.full_name || profile.email) + ". Showing what your roles unlock.";

  const rows = [];
  if (CalvaryAuth.hasAnyRole(profile, ["staff", "admin"])) {
    rows.push({ href: "https://calvaryhfgc.github.io/calvaryhephzibah/the-bridge/", icon: CalvaryIcons.book, title: "The Bridge", desc: "Operations, finance, and priorities dashboard" });
  }
  if (CalvaryAuth.hasAnyRole(profile, ["media", "staff", "admin"])) {
    rows.push({ href: "https://calvaryhfgc.github.io/calvaryhephzibah/control-room/", icon: CalvaryIcons.play, title: "Control Room", desc: "Live service overlay and operator console" });
  }
  if (CalvaryAuth.hasAnyRole(profile, ["volunteer", "staff", "admin"])) {
    rows.push({ href: "https://calvaryhfgc.github.io/calvaryhephzibah/calvary-os/rehearsal/", icon: CalvaryIcons.people, title: "Rehearsal Studio", desc: "Song arrangements, stems, and practice tools" });
  }
  if (CalvaryAuth.hasRole(profile, "admin")) {
    rows.push({ href: "#", icon: CalvaryIcons.person, title: "Governance", desc: "Private repository, ask Bolaji for access", muted: true });
  }
  document.getElementById("tool-rows").innerHTML = rows.map(r =>
    `<a href="${r.href}" class="row${r.muted ? ' muted' : ''}">
       <span class="row-icon">${r.icon}</span>
       <span class="row-body"><span class="row-title">${r.title}</span><span class="row-desc">${r.desc}</span></span>
       <span class="row-chevron">${CalvaryIcons.chevron}</span>
     </a>`
  ).join("");
})();
</script>

</body>
</html>
