<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Calvary Hephzibah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="nav.css">
<script src="vendor/supabase.js"></script>
</head>
<body>

<div class="wrap hidden" id="content">
  <div class="topbar" style="margin-top:8px;">
    <span id="greeting">Home</span>
    <a href="#" id="signout-link">Sign out</a>
  </div>

  <div class="media-frame">
    <img src="https://img.youtube.com/vi/lbTHlaMtwsk/hqdefault.jpg" alt="He Never Fails" style="height:200px; object-fit:cover; object-position:top;">
    <div class="media-caption">
      <div class="section-label">This week</div>
      <div style="font-family:'Instrument Serif',serif; font-size:22px; margin-bottom:14px;">He Never Fails</div>
      <a href="study.html" class="primary-btn" id="continue-study-btn">Start this week's study</a>
    </div>
  </div>

  <div class="row-list" id="team-shortcuts"></div>

  <div class="row-list">
    <a href="watch.html" class="row">
      <span class="row-icon">${'{{book}}'}</span>
      <span class="row-body"><span class="row-title">Watch &amp; explore</span><span class="row-desc">Clips, past sermons, and more</span></span>
      <span class="row-chevron">${'{{chevron}}'}</span>
    </a>
  </div>
</div>

<script src="icons.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script>
document.querySelectorAll(".row-list").forEach(el => {
  el.innerHTML = el.innerHTML
    .replace(/\{\{book\}\}/g, CalvaryIcons.book)
    .replace(/\{\{people\}\}/g, CalvaryIcons.people)
    .replace(/\{\{chevron\}\}/g, CalvaryIcons.chevron);
});

(async function () {
  const result = await CalvaryAuth.requireAuth();
  if (!result) return;
  const { profile } = result;

  document.getElementById("content").classList.remove("hidden");
  CalvaryNav.render("home", profile);

  const firstName = profile.full_name ? profile.full_name.split(" ")[0] : "there";
  document.getElementById("greeting").textContent = "Hi, " + firstName;
  document.getElementById("signout-link").onclick = (e) => { e.preventDefault(); CalvaryAuth.signOut(); };

  const hasProgress = ["s1-observe","s2-observe","s3-observe"].some(k => localStorage.getItem("hnf-" + k));
  if (hasProgress) document.getElementById("continue-study-btn").textContent = "Continue this week's study";

  const roles = profile.roles || [];
  const shortcuts = [];
  if (roles.some(r => ["staff","admin","volunteer","media"].includes(r))) {
    shortcuts.push({ href: "study.html?mode=leader", icon: CalvaryIcons.people, label: "Lead this week's Bible study", desc: "Group version with suggested answers" });
  }
  if (roles.some(r => ["volunteer","staff","admin"].includes(r))) {
    shortcuts.push({ href: "https://calvaryhfgc.github.io/calvaryhephzibah/calvary-os/rehearsal/", icon: CalvaryIcons.play, label: "Worship notes", desc: "Rehearsal Studio (opens separately)" });
  }
  if (shortcuts.length) {
    document.getElementById("team-shortcuts").innerHTML = shortcuts.map(s =>
      `<a href="${s.href}" class="row">
         <span class="row-icon">${s.icon}</span>
         <span class="row-body"><span class="row-title">${s.label}</span><span class="row-desc">${s.desc}</span></span>
         <span class="row-chevron">${CalvaryIcons.chevron}</span>
       </a>`
    ).join("");
  }
})();
</script>

</body>
</html>
