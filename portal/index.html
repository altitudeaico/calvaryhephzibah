<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calvary Hephzibah</title>
<meta name="description" content="Calvary Hephzibah Full Gospel Church.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<script src="vendor/supabase.js"></script>
<style>
  body { display: flex; min-height: 100vh; align-items: center; }
  .welcome-wrap { max-width: 380px; margin: 0 auto; padding: 24px; text-align: center; width: 100%; }
  .welcome-logo { width: 72px; height: 72px; margin: 0 auto 32px; }
  .welcome-wrap h1 { font-size: 30px; margin-bottom: 12px; }
  .welcome-wrap p { color: var(--ink-secondary); font-size: 16px; margin-bottom: 40px; line-height: 1.5; }
  .welcome-actions { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>

<div class="welcome-wrap">
  <img src="https://raw.githubusercontent.com/altitudeaico/calvaryhephzibah/main/sermon-library/ending-screen/logo/calvary-logo-roundel-transparent.png" alt="" class="welcome-logo">
  <h1>Welcome to Calvary Hephzibah</h1>
  <p>Sermons, weekly studies, and everything that keeps our church community connected.</p>

  <div class="welcome-actions">
    <a href="login.html" class="primary-btn">Sign in</a>
    <a href="login.html?mode=signup" class="secondary-btn">Create an account</a>
  </div>

  <a href="watch.html" class="text-link" style="margin-top:28px; display:inline-block;">Explore without signing in</a>
</div>

<script src="auth.js"></script>
<script>
(async function () {
  const { session } = await CalvaryAuth.init();
  if (session) window.location.replace("home.html");
})();
</script>

</body>
</html>
